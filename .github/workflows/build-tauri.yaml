name: Build Tauri Apps

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    name: Tauri ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            os: windows
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            label: windows-aarch64
            os: windows
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            os: macos
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            os: macos
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            os: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            os: linux

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate Tauri version source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const rootVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version

          if (tauriVersion !== '../package.json' && tauriVersion !== rootVersion) {
            console.error(`Tauri version must point to ../package.json or equal ${rootVersion}, got ${tauriVersion}`)
            process.exit(1)
          }

          console.log(`Tauri app version source: ${tauriVersion}`)
          NODE

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.target }}
          workspaces: |
            . -> target
          cache-on-failure: true

      - name: Install dependencies (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Validate Windows NSIS installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $bundleDir = "target/${{ matrix.target }}/release/bundle"
          $installers = @(Get-ChildItem -Path $bundleDir -Recurse -File -Filter '*-setup.exe')
          $msiFiles = @(Get-ChildItem -Path $bundleDir -Recurse -File -Filter '*.msi')

          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one NSIS setup.exe, found $($installers.Count)."
            Get-ChildItem -Path $bundleDir -Recurse -File | Select-Object -ExpandProperty FullName
            exit 1
          }

          if ($msiFiles.Count -ne 0) {
            Write-Error "MSI output is disabled, but MSI files were generated."
            $msiFiles | Select-Object -ExpandProperty FullName
            exit 1
          }

          Write-Output "Windows installer: $($installers[0].FullName)"

      - name: Upload Tauri artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.label }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.tar.gz
