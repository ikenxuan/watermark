name: Publish Preview

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "!**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    uses: ./.github/workflows/build.yaml

  build-tauri:
    uses: ./.github/workflows/build-tauri.yaml

  publish-preview:
    needs: [build-native, build-tauri]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      urls: ${{ steps.publish.outputs.urls }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Download prepared npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-publish-package
          path: publish

      - name: Publish to pkg.pr.new
        id: publish
        run: pnpm exec pkg-pr-new publish --comment=off './publish' './publish/npm/*'

      - name: Generate short sha
        id: gen-cmd
        run: |
          FULL_SHA="${{ steps.publish.outputs.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Get Tauri artifact names
        id: tauri-artifacts
        run: |
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | select(.name | startswith("tauri-")) | "- **\(.name)**"')
          echo "artifacts<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 📦 预览包发布成功

            ### 🏷️ 包信息
            - **主包:** `@ikenxuan/watermark`
            - **提交:** [`${{ steps.gen-cmd.outputs.short_sha }}`](https://github.com/${{ github.repository }}/tree/${{ github.sha }})

            ### 📥 NPM 安装命令
            ```bash
            npm i https://pkg.pr.new/@ikenxuan/watermark@${{ steps.gen-cmd.outputs.short_sha }}
            ```

            ### 📦 可选依赖包
            ```bash
            npm i ${{ steps.publish.outputs.urls }}
            ```

            ### 💻 Tauri 桌面应用
            ${{ steps.tauri-artifacts.outputs.artifacts }}

            请在 [Actions 运行页面](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) 下载对应平台的安装包。
          comment-tag: published-packages
          mode: upsert
          reactions: rocket
