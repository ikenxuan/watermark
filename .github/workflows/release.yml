name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-node-bindings:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  build-tauri:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-tauri.yaml

  upload-tauri-release:
    needs: [release-please, build-tauri]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Tauri artifacts
        uses: actions/download-artifact@v8
        with:
          path: tauri-artifacts
          pattern: tauri-*

      - name: Upload Tauri to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            tauri-artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release-please, build-node-bindings]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download prepared npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-publish-package
          path: publish

      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Publish npm packages
        shell: bash
        run: |
          cd publish
          pnpm config set provenance true
          pnpm config set registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}

          for package in npm/*; do
            if [ -d "$package" ]; then
              echo "Publishing $package"
              (cd "$package" && pnpm publish --access public --no-git-checks --ignore-scripts)
            fi
          done

          pnpm publish --access public --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync to Taobao Mirror
        run: |
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@ikenxuan/watermark/syncs"
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@ikenxuan/watermark-win32-x64-msvc/syncs"
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@ikenxuan/watermark-win32-arm64-msvc/syncs"
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@ikenxuan/watermark-darwin-x64/syncs"
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@ikenxuan/watermark-darwin-arm64/syncs"
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@ikenxuan/watermark-linux-x64-gnu/syncs"
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@ikenxuan/watermark-linux-arm64-gnu/syncs"
